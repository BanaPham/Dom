<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friend Requests</title>
  <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f0f2f5;
        display: flex;
        justify-content: center;
        padding: 20px;
    }
    .container {
        background: white;
        padding: 20px;
        border-radius: 10px;
        width: 600px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        overflow: hidden;
    }
    h3 {
        margin-bottom: 15px;
        margin-left: 8px;
        color: rgb(85, 85, 85);
        font-weight: 600;
    }
    .friend-list-wrapper {
        display: flex;
        align-items: center;
        position: relative;
        width: 100%;
    }
    .friend-list {
        display: flex;
        align-items: center;
        overflow-x: auto;
        white-space: nowrap;
        scroll-behavior: smooth;
        width: 100%;
        scrollbar-width: none;
    }
    .friend-list::-webkit-scrollbar {
        display: none;
    }
    .friend-request {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: #fff;
        padding: 10px;
        border-radius: 8px;
        margin-right: 10px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        text-align: center;
        min-width: 180px;
        max-width: 180px;
        box-shadow: rgba(0, 0, 0, 0.19) 0px 10px 20px, rgba(0, 0, 0, 0.23) 0px 6px 6px;
        margin-bottom: 20px;
    }
    .friend-request img {
        width: 100%;
        height: 100%;
        margin-bottom: 10px;
        border-top-left-radius: 10px;
        border-top-right-radius: 10px;
    }
    .friend-info {
        margin-bottom: 4px;
        float: left;
    }
    .buttons {
        display: flex;
        flex-direction: column;
        width: 100%;
    }
    .buttons button {
        width: 100%;
        padding: 8px;
        margin: 3px 0;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }
    .confirm {
        background-color: #dcf2f5;
        color: rgb(35, 115, 252);
        font-weight: bold;
        &:hover
        {
          opacity: 0.8;
        }
    }
    .delete {
        background-color: #e4e4e6;
        color: black;
        font-weight: bold;
        &:hover
        {
          opacity: 0.8;
        }
    }
    .see-all {
        color: #1877f2;
        text-decoration: none;
        font-weight: bold;
        &:hover
        {
          opacity: 0.8;
        }
    }
    .friends-chung {
        color: gray;
        font-size: 15px;
    }
    .confirm.clicked {
        background-color: #accff7; 
        color: #5a5a5a; 
        cursor: not-allowed; 
    }
    .level-buttons {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-top: 20px;
    }
    .level-buttons button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        border: none;
        border-radius: 5px;
        transition: background-color 0.3s;
        &:hover {
          background-color: #72b6f6;
          color: white;
        }
    }
    .level-buttons-current {
        background-color: #0484fb;
        color: white;
    }
  </style>
</head>
<body>
    <div class="container">
        <div class="level-buttons">
            <button class="level-btn" data-level="1">Level 1</button>
            <button class="level-btn" data-level="2">Level 2</button>
            <button class="level-btn" data-level="3">Level 3</button>
        </div>
    
        <h3>Friend Requests</h2>
        <div class="friend-list-wrapper">
            <div class="friend-list" id="friendList">
                <div class="friend-request">
                    <img src="/public/meo.jpg" class="img-user" alt="Avatar">
                    <div class="friend-info">
                        <strong>A</strong>
                        <p class="friends-chung">10 mutual friends</p>
                    </div>
                    <div class="buttons">
                        <button class="confirm">Confirm</button>
                        <button class="delete">Delete</button>
                    </div>
                </div>
                <div class="friend-request">
                    <img src="/public/meo.jpg" class="img-user" alt="Avatar">
                    <div class="friend-info">
                        <strong>B</strong>
                        <p class="friends-chung">6 mutual friends</p>
                    </div>
                    <div class="buttons">
                        <button class="confirm">Confirm</button>
                        <button class="delete">Delete</button>
                    </div>
                </div>
                <div class="friend-request">
                    <img src="/public/meo.jpg" class="img-user" alt="Avatar">
                    <div class="friend-info">
                        <strong>C</strong>
                        <p class="friends-chung">6 mutual friends</p>
                    </div>
                    <div class="buttons">
                        <button class="confirm">Confirm</button>
                        <button class="delete">Delete</button>
                    </div>
                </div>
                <div class="friend-request">
                    <img src="/public/meo.jpg" class="img-user" alt="Avatar">
                    <div class="friend-info">
                        <strong>Dương Quang Hào</strong>
                        <p class="friends-chung">6 mutual friends</p>
                    </div>
                    <div class="buttons">
                        <button class="confirm">Confirm</button>
                        <button class="delete">Delete</button>
                    </div>
                </div>
                <div class="friend-request">
                    <img src="/public/meo.jpg" class="img-user" alt="Avatar">
                    <div class="friend-info">
                        <strong>D</strong>
                        <p class="friends-chung">6 mutual friends</p>
                    </div>
                    <div class="buttons">
                        <button class="confirm">Confirm</button>
                        <button class="delete">Delete</button>
                    </div>
                </div>
            </div>
        </div>
        <div style="text-align: center; margin-top: 10px;">
            <a href="#" class="see-all">See all</a>
        </div>
    </div>
    <script>
        const friendList = document.getElementById('friendList');

        const level = localStorage.getItem('level');

        const confirmBtns = document.querySelectorAll('.confirm');
        confirmBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                if (level === '2') {
                    btn.innerText = 'Accepted';
                    event.target.classList.add('clicked');
                } else if (level === '3') {
                    const friendRequest = event.target.closest('.friend-request');
                    friendRequest.parentElement.removeChild(friendRequest);
                } else {
                    btn.innerText = 'Accepted';
                }
            });
        });
        
        const levelButtons = document.querySelectorAll('.level-btn');

        for(let i = 0; i < 3; i++){
            if(levelButtons[i].getAttribute('data-level') === level){
                levelButtons[i].classList.add('level-buttons-current');
            }
            else{
                levelButtons[i].classList.remove('level-buttons-current');
            }
        }

        levelButtons.forEach(button => {
            button.addEventListener('click', () => {
                const level = button.getAttribute('data-level')
                localStorage.setItem('level', level);
                window.location.reload();
            });
        });
    </script>
</body>
</html>
